version: 2

data_tests:

  - name: assert_despesas_classificada_apontamento
    description: |
      Valida a coerência da matriz de apontamentos da CGM em 5 quadrantes:
      1. Regras graves ativas exigem `apontamento_resultado = 'Grave'`.
      2. Registros 'Grave' devem ter ao menos uma condição grave ativa.
      3. Registros 'Leve' exigem ausência de flags graves e ao menos uma leve ativa.
      4. Registros 'Descartado' não podem possuir nenhuma irregularidade ativa.
      5. 'Não avaliado' deve espelhar estritamente despesas com status 'NF Sem Match'.
    config:
      severity: error
      store_failures: false
      tags: ['cgm', 'mart', 'regras_apontamento']

  - name: assert_despesas_classificada_emissao_posterior_pagamento
    description: |
      Verifica a consistência temporal das despesas declaradas e extraídas:
      - A data de emissão não pode ser posterior à data de pagamento.
      - A data de emissão deve ser posterior à data de fundação cadastral do fornecedor.
    config:
      severity: warn
      store_failures: false
      tags: ['cgm', 'mart', 'temporal']

  - name: assert_despesas_classificada_duplicidade
    description: |
      Audita se despesas com flag de duplicidade ativa (`apontamento_duplicidade_indicador = true`)
      possuem a lista de identificadores correlatos preenchida em `apontamento_duplicidade_ids`.
    config:
      severity: error
      store_failures: false
      tags: ['cgm', 'mart', 'duplicidade']