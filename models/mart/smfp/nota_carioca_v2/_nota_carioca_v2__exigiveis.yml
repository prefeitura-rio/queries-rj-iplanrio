version: 2

# R-06, R-07, R-10 e R-11: cenário de exigibilidade, fiscalização e as exigíveis v2.

models:
  - name: int_nc2__cenario
    description: >
      R-06 e R-07. CENARIO_EXIGIBILIDADE de cada nota, recalculado do estado atual do cadastro (sem a janela de 7 dias),
      com a correção catalogada B-04: 4 e 5 antes, a habilitação só para ISS próprio, e ISS retido cai em 0.
    columns:
      - name: nota_nacional
        data_tests:
          - unique:
              name: int_nc2__cenario__nota_nacional__unique
      - name: cenario_exigibilidade
        description: "-1 aguarda habilitação, 0 ISS devido, 1 IF, 2 pedágio, 3 Simples, 4 Plano C, 5 sem ISS no Rio, 6 suspensa."
        data_tests:
          - not_null:
              name: int_nc2__cenario__cenario_exigibilidade__not_null
          - accepted_values:
              name: int_nc2__cenario__cenario_exigibilidade__accepted_values
              arguments:
                values: [-1, 0, 1, 2, 3, 4, 5, 6]
                quote: false

  - name: int_nc2__fiscalizacao
    description: >
      R-10. FISCALIZACAO (0, 1 ou 2) de cada nota; origem_replicada: o valor vem da réplica do Oracle até o corpo de
      RPE_FISCALIZACAO estar disponível.
    columns:
      - name: chave_acesso
        data_tests:
          - unique:
              name: int_nc2__fiscalizacao__chave_acesso__unique
      - name: fiscalizacao
        data_tests:
          - accepted_values:
              name: int_nc2__fiscalizacao__fiscalizacao__accepted_values
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: origem_fiscalizacao
        data_tests:
          - accepted_values:
              name: int_nc2__fiscalizacao__origem_fiscalizacao__accepted_values
              arguments:
                values: ["origem_replicada"]

  - name: mvt_notas_nacionais_exigiveis_detalhes
    description: >
      R-11, detalhe. Notas exigíveis (status 0, fiscalização diferente de 2, cenário 0). Mesmas 19 colunas, nomes e tipos
      de mart_nota_carioca__notas_nacionais_exigiveis_detalhes.
    data_tests:
      - nc2_colunas_iguais:
          name: mvt_notas_nacionais_exigiveis_detalhes__colunas_iguais_ao_atual
          arguments:
            fonte: nota_carioca_mvt
            tabela: MVT_NOTAS_NACIONAIS_EXIGIVEIS_DETALHES
    columns:
      - name: cpf_cnpj_responsavel
        description: "CPF/CNPJ de quem recolhe o ISS (prestador, tomador ou intermediário conforme tpRetISSQN)."
      - name: nome_contraparte
        description: "Nome da contraparte (nulo na sentinela de tomador não identificado)."
      - name: cpf_cnpj_contraparte
        description: "CPF/CNPJ da contraparte; '00000000000000' quando o tomador não foi identificado."
      - name: retencao
        description: "0 ISS não retido, 1 retido."
        data_tests:
          - accepted_values:
              name: mvt_notas_nacionais_exigiveis_detalhes__retencao__accepted_values
              arguments:
                values: [0, 1]
                quote: false
      - name: valor_servico
        description: "DPS.VALOR_SERVICO."
      - name: valor_ded_red
        description: "Dedução/redução da nota; pode ser nulo."
      - name: valor_issqn
        description: "ISSQN da nota."
      - name: valor_base_calculo
        description: "Base de cálculo da nota."
      - name: nota_fiscal
        description: "Número da NFS-e (nNFSe)."
      - name: chave_acesso
        description: "Chave de acesso de 50 dígitos."
      - name: data_validacao
        description: "Validação da nota (dhProc), texto AAAA-MM-DDTHH:MM:SS."
      - name: data_competencia_municipio
        description: "Competência municipal, texto AAAA-MM-01T00:00:00."
      - name: tipo_retencao
        description: "tpRetISSQN: 1 não retido, 2 retido pelo tomador, 3 pelo intermediário."
      - name: nota_nacional
        description: "Id da NFS-e (NFS + chave)."
      - name: dps
        description: "Id da DPS."
      - name: opcao_simples_nacional
        description: "Opção pelo Simples do prestador: 1 não optante, 2 MEI, 3 ME/EPP."
      - name: _bigquery_particao_data
        description: "Competência municipal como data; partição mensal."
      - name: _bigquery_updated_at
        description: "Instante da materialização (America/Sao_Paulo)."
      - name: _bigquery_uid
        description: "Chave: dps e competência municipal."
        data_tests:
          - unique:
              name: mvt_notas_nacionais_exigiveis_detalhes__bigquery_uid__unique
          - not_null:
              name: mvt_notas_nacionais_exigiveis_detalhes__bigquery_uid__not_null

  - name: mvt_notas_nacionais_exigiveis
    description: >
      R-11, resumo por (CPF/CNPJ do responsável, competência municipal, tipo de retenção, opção pelo Simples, retenção).
      Mesmas 17 colunas, nomes e tipos de mart_nota_carioca__notas_nacionais_exigiveis.
    data_tests:
      - nc2_colunas_iguais:
          name: mvt_notas_nacionais_exigiveis__colunas_iguais_ao_atual
          arguments:
            fonte: nota_carioca_mvt
            tabela: MVT_NOTAS_NACIONAIS_EXIGIVEIS
    columns:
      - name: _bigquery_uid
        description: "Chave das 5 dimensões."
        data_tests:
          - unique:
              name: mvt_notas_nacionais_exigiveis__bigquery_uid__unique
          - not_null:
              name: mvt_notas_nacionais_exigiveis__bigquery_uid__not_null
