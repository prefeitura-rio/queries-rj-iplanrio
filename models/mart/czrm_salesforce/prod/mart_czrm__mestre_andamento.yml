version: 2

models:
  - name: mart_czrm__mestre_andamento
    description: 'Histórico de andamentos das ordens de serviço: 1 linha por andamento, para montar a timeline da OS.'
    columns:
      - name: andamento_id
        data_type: string
        description: 'Chave do andamento no Salesforce (`WorkOrderUpdate__c.Id`, 18 caracteres).'
      - name: os_id
        data_type: string
        description: 'Relacionamento que vincula o andamento à OS correspondente (`WorkOrder_c__c`).'
      - name: numero_os
        data_type: string
        description: 'Número da OS exibido ao cidadão e ao órgão (ex.: `00000009`).'
      - name: numero_protocolo
        data_type: string
        description: 'Número do protocolo (`Case.CaseNumber`) ao qual a OS pertence.'
      - name: data_hora
        data_type: timestamp
        description: 'Data do andamento: `coalesce(data_hora_andamento, created_date)`. Usa a data informada pelo órgão quando existe e a criação do registro quando não. Nunca nula.'
      - name: tipo
        data_type: string
        description: 'Tipo do evento de andamento (`Event_Type__c`): `Close_WO`, `Partial_Update`, `Internal_Note`, `Change_Queue_UO`, `Integracao`, `External_Update`, `Transfer_WO`, `Cancel_WO`, `Change_Priority`.'
      - name: status
        data_type: string
        description: 'Status do órgão normalizado (`Status_Normalizado__c`). Só existe em andamentos que carregam status do órgão (~18%).'
      - name: titulo
        data_type: string
        description: 'Código do andamento (`WorkOrderUpdate__c.Name`, formato `AOS-00000`). Não é título nem resumo — o texto está em `descricao`.'
      - name: descricao
        data_type: string
        description: 'Relato atual do andamento.'
      - name: criado_por
        data_type: string
        description: 'Nome do usuário que criou o registro.'
      - name: visivel_cidadao
        data_type: boolean
        description: 'Campo fórmula que verifica se a configuração do evento permite visibilidade para o cidadão e se o evento de andamento já encontra-se publicado.'
      - name: informado_em
        data_type: timestamp
        description: 'Data/hora crua informada pelo órgão (`Data_Hora_Andamento__c`). Nula nos andamentos criados no CRM.'
      - name: situacao
        data_type: string
        description: 'Situação do andamento no CRM (`Status__c`): Publicado, Aguardando aprovação, Rejeitado, Cancelado, Rascunho etc. Sempre preenchida; é o que diferencia um andamento publicado de um rascunho.'
      - name: publicado_em
        data_type: timestamp
        description: 'Data/hora em que o andamento virou oficial (`publication_datetime`). Pode ser posterior à criação; não usar para ordenar a timeline.'
