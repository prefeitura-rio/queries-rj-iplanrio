version: 2

models:
  - name: mart_app_eleicoes__fct_comparecimento_secao
    description: "Comparecimento e abstenção por seção eleitoral do RJ, por ano, turno e cargo (2022, 2024 e 2026). Os votos válidos são calculados como votos nominais mais votos de legenda, pois a fonte por seção não os traz."
    config:
      alias: fct_comparecimento_secao
      schema: app_eleicoes
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: mart_app_eleicoes__fct_comparecimento_secao__table__unique_combination
          arguments:
            combination_of_columns:
              - ano
              - turno
              - cargo
              - id_secao
          config:
            severity: error
    columns:
      - name: ano
        description: "Ano da eleição."
        data_type: int64
        data_tests:
          - not_null:
              name: mart_app_eleicoes__fct_comparecimento_secao__ano__not_null
              config:
                severity: error

      - name: turno
        description: "Turno da eleição (1 ou 2)."
        data_type: int64
        data_tests:
          - not_null:
              name: mart_app_eleicoes__fct_comparecimento_secao__turno__not_null
              config:
                severity: error

      - name: cargo
        description: "Cargo disputado: `presidente`, `governador` ou `prefeito`."
        data_type: string
        quote: true
        data_tests:
          - not_null:
              name: mart_app_eleicoes__fct_comparecimento_secao__cargo__not_null
              config:
                severity: error
          - accepted_values:
              name: mart_app_eleicoes__fct_comparecimento_secao__cargo__accepted_values
              arguments:
                values: ["presidente", "governador", "prefeito"]
              config:
                severity: error

      - name: id_secao
        description: "Chave da seção: `id_zona`, hífen e seção com 4 dígitos."
        data_type: string
        quote: true
        data_tests:
          - not_null:
              name: mart_app_eleicoes__fct_comparecimento_secao__id_secao__not_null
              config:
                severity: error

      - name: id_zona
        description: "Chave da zona eleitoral da seção."
        data_type: string
        quote: true
        data_tests:
          - not_null:
              name: mart_app_eleicoes__fct_comparecimento_secao__id_zona__not_null
              config:
                severity: error
          - relationships:
              name: mart_app_eleicoes__fct_comparecimento_secao__id_zona__relationships
              arguments:
                to: ref('mart_app_eleicoes__dim_zona')
                field: id_zona
              config:
                severity: error

      - name: aptos
        description: "Eleitores aptos a votar."
        data_type: int64

      - name: comparecimento
        description: "Eleitores que compareceram."
        data_type: int64

      - name: abstencoes
        description: "Eleitores que se abstiveram."
        data_type: int64

      - name: votos_validos
        description: "Votos válidos (nominais mais de legenda)."
        data_type: int64

      - name: votos_brancos
        description: "Votos em branco."
        data_type: int64

      - name: votos_nulos
        description: "Votos nulos."
        data_type: int64

      - name: votos_nominais
        description: "Votos nominais, dados a candidatos."
        data_type: int64

      - name: votos_legenda
        description: "Votos de legenda. Zero nos cargos majoritários do recorte."
        data_type: int64

      - name: proporcao_comparecimento
        description: "Comparecimento sobre aptos, de 0 a 1."
        data_type: float64
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: mart_app_eleicoes__fct_comparecimento_secao__proporcao_comparecimento__expect_column_values_to_be_between
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn

      - name: proporcao_abstencao
        description: "Abstenções sobre aptos, de 0 a 1."
        data_type: float64
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: mart_app_eleicoes__fct_comparecimento_secao__proporcao_abstencao__expect_column_values_to_be_between
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn

      - name: proporcao_votos_validos
        description: "Votos válidos sobre o comparecimento, de 0 a 1."
        data_type: float64
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: mart_app_eleicoes__fct_comparecimento_secao__proporcao_votos_validos__expect_column_values_to_be_between
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn

      - name: proporcao_votos_brancos
        description: "Votos em branco sobre o comparecimento, de 0 a 1."
        data_type: float64
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: mart_app_eleicoes__fct_comparecimento_secao__proporcao_votos_brancos__expect_column_values_to_be_between
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn

      - name: proporcao_votos_nulos
        description: "Votos nulos sobre o comparecimento, de 0 a 1."
        data_type: float64
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: mart_app_eleicoes__fct_comparecimento_secao__proporcao_votos_nulos__expect_column_values_to_be_between
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
