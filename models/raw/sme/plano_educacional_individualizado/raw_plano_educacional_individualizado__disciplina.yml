version: 2

models:
  - name: raw_plano_educacional_individualizado__disciplina
    description: |
      **Origem**: GestaoEscolar.dbo.PEI_Disciplina
      Disciplinas a serem usadas no PEI"
    columns:
      - name: id_disciplina
        description: "Id da Disciplina"
        data_type: int64

      - name: nome_disciplina
        description: "Nome da Disciplina"
        data_type: string
        quote: true

      - name: id_nivel
        description: "Nível (FK)"
        data_type: int64

      - name: id_modalidade
        description: "Modalidade (FK)"
        data_type: int64

      - name: flag_disciplina_plano_educacional
        description: "É PEI? Sim (1) ou Não (0)"
        data_type: boolean

      - name: loaded_at
        description: "Timestamp de quando o dado foi extraído do banco de dados de origem."
        data_type: timestamp

      - name: transformed_at
        description: "Timestamp de quando o dado foi transformado no dbt."
        data_type: timestamp
