version: 2

sources:
  - name: brutos_gestao_escolar_staging
    database: rj-iplanrio
    schema: brutos_gestao_escolar_staging
    config:
      freshness: # default freshness
        error_after: {count: 24, period: hour}
      loaded_at_field: _airbyte_extracted_at
    tables:
      - name: ACA_AlunoCurriculo
      - name: ACA_AlunoJustificativaFalta
      - name: ACA_Avaliacao
      - name: ACA_CalendarioAnual
      - name: ACA_CalendarioPeriodo
      - name: ACA_CurriculoPeriodo
      - name: ACA_FormatoAvaliacao
      - name: ACA_TipoJustificativaFalta
      - name: ACA_TipoTurno
      - name: ACA_Turno
      - name: ACA_TurnoHorario
      - name: CLS_TurmaAula
      - name: ESC_Escola
      - name: MTR_MatriculaTurma
        config:
          freshness:
            error_after: {count: 72, period: hour}
      - name: MTR_ProcessoFechamentoInicio
      - name: TUR_Turma
      - name: TUR_TurmaCurriculo
      - name: TUR_TurmaDisciplina
        config:
          freshness:
            error_after: {count: 96, period: hour}
      - name: ACA_Aluno
      - name: ACA_Religiao
      - name: ESC_UnidadeEscola
      - name: PPE_ProjetoPrograma
      - name: PPE_TipoExtensividade
      - name: PPE_AlunoProjetoPrograma
      - name: VW_BI_Aluno
      - name: CLS_ConfirmacaoEfetivacao
      - name: turma
        config:
          loaded_at_field: CAST(_prefect_extracted_at AS TIMESTAMP)
      - name: TUR_TurmaRelTurmaDisciplina
        config:
          loaded_at_field: CAST(_prefect_extracted_at AS TIMESTAMP)
      - name: VW_BI_Aluno_Todos_Os_Anos
        config:
          loaded_at_field: CAST(_prefect_extracted_at AS TIMESTAMP)
      - name: CLS_TurmaAulaAluno
        config:
          loaded_at_field: CAST(_prefect_extracted_at AS TIMESTAMP)
      - name: numeroDeAulasCte
        config:
          loaded_at_field: CAST(_prefect_extracted_at AS TIMESTAMP)
      - name: diasCoc
        config:
          loaded_at_field: CAST(_prefect_extracted_at AS TIMESTAMP)
      - name: CLS_AlunoAvaliacaoTurma
        config:
          loaded_at_field: CAST(_prefect_extracted_at AS TIMESTAMP)
