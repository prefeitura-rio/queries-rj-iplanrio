      - name: pre_work_brief_prompt_template
        description: "Enter the ID of your activated Pre-Work Brief prompt template. To find your ID, open the template in Prompt Builder and copy the characters after \"EinsteinPromptStudio/\" from the URL. For example, in this URL:  https://testcom98.test1.my.pc-rnd.salesforce-setup.com/lightning/setup/EinsteinPromptStudio/0hfSG000001SUFVYA4/edit?c__versionId=3vNSG0000000g8v2AA, the ID is 0hfSG000001SUFVYA4."
        data_type: string
      - name: post_work_summary
        description: "Enter a summary manually. Or if you’re using Agentforce, your AI agent can fill in the summary for you."
        data_type: string
      - name: is_confidential
        description: "Serviços sigilosos não aparecem na consulta pública do portal e também na busca padrão dentro do sistema. A visibilidade da ordem de serviço fica restrita à fila da UO executora e ao perfil de Ouvidor."
        data_type: boolean
      - name: service_category
        description: "Categoria do serviço (Solicitação, Reclamação, Informação, etc.). Define o SLA, regras de roteamento, campos de formulário e outros parâmetros aplicáveis a esta OS."
        data_type: string
      - name: service
        description: "Tema/assunto mestre do serviço solicitado. Referência ao catálogo de serviços da Prefeitura, identificando \"o quê\" está sendo atendido."
        data_type: string
      - name: main_organizational_unit
        description: "Órgão central responsável pelo serviço"
        data_type: string
      - name: service_hyperlink
        description: "Exibe o nome e a categoria do serviço como hyperlink para a categoria do serviço. Uso exclusivo de UI (compact layout, list views). NÃO usar em e-mails ou comunicações externas: o valor contém marcação HTML de âncora."
        data_type: string
      - name: dynamic_form_config
        description: "Snapshot JSON da configuração do formulário dinâmico no momento da criação da Work Order. Gravado pelo Screen Flow de criação de protocolo. Lido pelo LWC serviceAttributesViewer na Record Page."
        data_type: string
      - name: has_equivalents
        description: "Indica que esta OS e uma agrupadora, ou seja, possui OS equivalentes vinculadas a ela (WorkOrder_Relationship__c com Tipo = Equivalencia). Derivado de Equivalent_Count__c, por isso e sempre consistente com o vinculo real."
        data_type: boolean
      - name: last_update_status
        description: "Cópia de WorkOrderUpdate__c.Status__c do andamento mais recente da OS pai (CreatedDate DESC, Id DESC, sem Rascunho); vazio quando não há andamento. Mantido por WorkOrderLastUpdateStatusService (painel-filtro-status-andamento) para o filtro Status do andamento do Painel de Monitoramento. Não editar à mão."
        data_type: string
      - name: origin
        description: "Canal de origem onde o serviço foi ingressado."
        data_type: string
      - name: assigned_uo
        description: "Unidade Organizacional responsável pelo atendimento desta Work Order."
        data_type: string
      - name: fsl_is_fill_in_candidate
        description: "É candidato a preenchimento"
        data_type: boolean
      - name: fsl_prevent_geocoding_for_chatter_actions
        description: "Impedir geocodificação para ações do Chatter"
        data_type: boolean
      - name: fsl_scheduling_priority
        description: "Prioridade de agendamento"
        data_type: numeric
      - name: external_ticket_id
        description: "Número do chamado no sistema do órgão (codigoOcorrencia). Referência; não parear com a categoria do serviço."
        data_type: string
      - name: integration_direction
        description: "Marcador anti-loop: inbound = chamado originado de um evento da VOLTA (não redispara IDA)."
        data_type: string
      - name: neighborhood
        description: "Bairro"
        data_type: string
      - name: close_reason
        description: "Motivo de fechamento"
        data_type: string
      - name: categoria
        description: "Indica a categoria do serviço associado a ordem do serviço"
        data_type: string
      - name: service_catalog_formula
        description: "Nome e categoria do serviço em texto puro. Consumido por e-mails transacionais (nova solicitação, andamento da OS, pedido de informação) — NÃO adicionar HYPERLINK() aqui, pois o valor é injetado sem sanitização no corpo dos e-mails. Para exibição clicável em UI usar Service_Hyperlink__c."
        data_type: string
      - name: protocolo_hyperlink
        description: "Gera o número de protocolo oficial no formato RIO-YYYYXXXXXXXX (16 caracteres). Utiliza o ano de criação do registro e uma lógica de dispersão baseada na Semente do Protocolo para evitar números sequenciais, dificultando o scraping e garantindo 100 milhões de combinações anuais."
        data_type: string
      - name: is_abrangencia
        description: "Indica que o estagio de abrangencia foi executado com sucesso para esta WO."
        data_type: boolean
      - name: is_equivalencia
        description: "Indica que esta OS foi agrupada por uma OS agrupadora (e membro de um agrupamento de equivalencia). NAO indica que a OS e agrupadora: para isso usar Has_Equivalents__c. A agrupadora permanece com este campo false."
        data_type: boolean
      - name: is_vinculacao
        description: "Indica que o estagio de vinculacao foi executado para esta WO."
        data_type: boolean
      - name: integration_source
        description: "Origem do chamado quando criado pela integração (marcador anti-loop). Ex.: DEFESA."
        data_type: string
      - name: operador_matricula
        description: "Matrícula do operador informada pelo órgão no reverso (texto; não é usuário do Salesforce)."
        data_type: string
      - name: operador_nome
        description: "Nome do operador informado pelo órgão no reverso (texto; não é usuário do Salesforce)."
        data_type: string
      - name: address_type
        description: "Tipo do endereco da ocorrencia: Casa, Condominio ou Vila."
        data_type: string
      - name: complement
        description: "Complemento do endereco da ocorrencia (apto, bloco, sala, casa, etc.)."
        data_type: string
      - name: door_number
        description: "Numero da porta separado do logradouro. Compatibilidade com SGRC."
        data_type: string
      - name: favela_code
        description: "Codigo da favela conforme IPP Favelas_Urbanizacao (cod_favela_1). Preenchido automaticamente pelo mapa."
        data_type: string
      - name: favela_name
        description: "Nome da favela/comunidade onde a ocorrencia esta localizada. Preenchido do IPP Favelas_Urbanizacao ou GeoJSON local."
        data_type: string
      - name: geolocation_precise
        description: "Indica se a geolocalizacao do endereco foi obtida com precisao ROOFTOP"
        data_type: boolean
      - name: ipp_street_name
        description: "Nome oficial do logradouro conforme cadastro IPP (Logradouro Georreferenciamento). Pode diferir de Address.Street se o cidadao digitou um nome popular."
        data_type: string
      - name: is_favela
        description: "Indica se o local da ocorrencia esta dentro de uma area de favela/comunidade. Preenchido automaticamente pelo mapa via GeoJSON/IPP."
        data_type: boolean
      - name: landmark
        description: "Ponto de referencia do local da ocorrencia para facilitar a localizacao (ex: proximo ao mercado, em frente a praca)."
        data_type: string
      - name: no_number
        description: "Indica que o local da ocorrencia nao possui numero. Quando marcado, o campo de nome de via nao oficial pode ser preenchido."
        data_type: boolean
      - name: public_way_code
        description: "Codigo do Logradouro (CL) IPP da via da ocorrencia. Preenchido via enriquecimento Apex apos confirmacao do endereco."
        data_type: string
      - name: public_way
        description: "Nome do logradouro extraido do Google Places (sem numero). Ex: Avenida Lucio Costa"
        data_type: string
      - name: operador_origem
        description: "Origem do operador informado pelo órgão no reverso (ex.: PCRJ). Texto livre; não é usuário do Salesforce."
        data_type: string
      - name: is_anonymous
        description: "Indica que a ordem de serviço foi aberta anonimamente."
        data_type: boolean
      - name: latitude_display
        description: "Exibe a latitude do endereco da OS em formato texto."
        data_type: string
      - name: longitude_display
        description: "Exibe a longitude do endereco da OS em formato texto."
        data_type: string
      - name: equivalent_count
        description: "Quantidade de WOs equivalentes vinculadas a esta WO agrupadora (vinculos com Tipo = Equivalencia)."
        data_type: numeric
      - name: data_fechamento
        description: "Data/hora em que a WorkOrder foi fechada (status Fechado ou Cancelado). Gravado automaticamente no after insert/update. É a fonte da janela pós-fechamento de Ouvidoria (CZRM-2369). Não confundir com WorkOrder.EndDate, que não é populado nesta org."
        data_type: timestamp
      - name: is_wo_closed
        description: "Indica se a ordem de serviço está fechada considerando os status Fechado e Cancelado (o IsClosed nativo não trata Cancelado)."
        data_type: boolean
      - name: em_fila_fallback
        description: "CZRM-1785. Verdadeiro enquanto a OS estiver na fila de falhas de roteamento. Diferente de Routing_Fallback__c, que e marca historica e permanece verdadeira mesmo depois de a OS ser reatribuida. Este campo existe para o aviso em tela aparecer apenas enquanto a OS estiver de fato parada na fila."
        data_type: boolean
      - name: routing_fallback
        description: "CZRM-1785. Marcado quando o roteamento por abrangencia nao concluiu e a OS foi atribuida a fila de falhas de roteamento. Diferente de Is_Abrangencia__c, que apenas indica que o estagio de roteamento foi executado."
        data_type: boolean
      - name: tipo_solicitante
        description: "Tipo do solicitante do chamado. Preenchido no reverso da Defesa (m14); um protocolo pode ter chamados do cidadão e internos/servidor."
        data_type: string
      - name: integration_number
        description: "Número do chamado usado na integração = base + WorkOrderNumber. Fonte da faixa de roteamento (>= base = Salesforce). Formula, sem armazenamento."
        data_type: numeric
      - name: os_owner
        description: "Campo fórmula que indica o proprietário da Ordem de Serviço, com atalho para visualização do usuário ou dos membros da fila da UO"
        data_type: string
      - name: motivo_nao_execucao
        description: "Motivo pelo qual o serviço não pôde ser executado. Preenchido pelo executor no app mobile. Fonte: Carta de Serviço 1746 (PPTX 10/06/2025)."
        data_type: string
      - name: operador_telefone
        description: "Telefone do operador informado pelo orgao no reverso (m14)."
        data_type: string
      - name: solicitante_nome
        description: "Nome do solicitante do reverso (m14). Texto livre - sem Person Account/CPF."
        data_type: string
      - name: solicitante_telefone
        description: "Telefone do solicitante informado pelo orgao no reverso (m14)."
        data_type: string
      - name: tem_dados_departamentais
        description: "True quando a OS do reverso possui dados departamentais (solicitante/operador nome ou telefone). Governa a visibilidade condicional no layout."
        data_type: boolean
      - name: service_hyperlink_without_category
        description: "Exibe o nome do serviço como hyperlink para a categoria do serviço. Uso exclusivo de UI (compact layout, list views). NÃO usar em e-mails ou comunicações externas: o valor contém marcação HTML de âncora."
        data_type: string
      - name: sla_target_date
        description: "Prazo do serviço"
        data_type: timestamp
      - name: canal_atendimento
        description: "Canal de atendimento da OS (valor de API de Case.Origin). Gravado na criação: copiado do chamado pelo WorkOrderTrigger (WorkOrderOriginService) quando a OS tem chamado e o campo vem vazio; OS sem chamado grava o próprio canal. Substitui a leitura da fórmula Origin__c, que continua existindo."
        data_type: string
      - name: expected_attachments
        description: "Quantidade de anexos que o cidadao vai enviar nesta OS (informada na abertura - ex.: attachmentsCount do portal). O gate de automacao do M1 aguarda o vinculo destes anexos antes de liberar a Ocorrencia (CZRM-1670)."
        data_type: numeric
      - name: address_enrichment_at
        description: "Momento em que o enriquecimento de endereco via IPP foi TENTADO (sucesso, divergencia ou falha). O gate do m1 usa este carimbo para nao esperar indefinidamente por um enriquecimento que nao vem mais."
        data_type: timestamp
      - name: equivalence_analysis_at
        description: "Momento em que a analise de equivalencia pos-criacao terminou (com ou sem agrupamento). O gate do m1 usa este carimbo para nao liberar a ocorrencia antes da relationship existir - evita chamado duplicado no orgao."
        data_type: timestamp
      - name: last_update_date
        description: "Cópia de WorkOrderUpdate__c.CreatedDate do andamento mais recente da OS pai (CreatedDate DESC, Id DESC, sem Rascunho); vazio quando não há andamento. Mantido por WorkOrderLastUpdateStatusService junto com Last_Update_Status__c (CZRM-2422) para a base Último andamento do filtro Período do Painel de Monitoramento. Não editar à mão."
        data_type: timestamp
      - name: _airbyte_extracted_at
        description: "Data/hora da extração no Airbyte (controle de carga)."
        data_type: datetime
        data_tests:
          - no_missing_dates

  - name: raw_czrm_staging__work_order_attribute_answer
    description: "Tabela raw do objeto Salesforce correspondente a work_order_attribute_answer (staging)."
    columns:
      - name: id
        description: "ID do registro"
        data_type: string
        data_tests:
          - unique:
              name: raw_czrm_staging__work_order_attribute_answer__id__unique
              config:
                severity: error
          - not_null:
              name: raw_czrm_staging__work_order_attribute_answer__id__not_null
              config:
                severity: error
      - name: is_deleted
        description: "Excluído"
        data_type: boolean
      - name: name
        description: "Cód. Atributo da Ordem de Serviço"
        data_type: string
      - name: created_date
        description: "Data de criação"
        data_type: timestamp
      - name: created_by_id
        description: "ID do criador"
        data_type: string
      - name: last_modified_date
        description: "Data da última modificação"
        data_type: timestamp
      - name: last_modified_by_id
        description: "ID do último modificador"
        data_type: string
      - name: system_modstamp
        description: "Carimbo de modificação do sistema"
        data_type: timestamp
      - name: last_viewed_date
        description: "Data da última visualização"
        data_type: timestamp
      - name: last_referenced_date
        description: "Data da última referência"
        data_type: timestamp
      - name: work_order
        description: "Ordem de Serviço à qual a resposta do atributo pertence. Relacionamento Mestre-Detalhe: herda o compartilhamento da OS e é excluído em cascata com ela."
        data_type: string
      - name: answered_at
        description: "Data e hora em que a resposta foi registrada na Ordem de Serviço."
        data_type: timestamp
      - name: attribute_label
        description: "Rótulo do atributo exibido ao cidadão/despachador no momento da resposta. Congelado aqui para preservar o histórico e permitir relatório sem depender da configuração atual."
        data_type: string
      - name: attribute_type
        description: "Tipo do atributo (Text, TextArea, Number, Date, DateTime, Picklist, Multipicklist, Checkbox, Phone, Email, Endereco, Customizado) no momento da resposta. Define qual campo de valor está preenchido nesta linha."
        data_type: string
      - name: external_key
        description: "Chave de idempotência da resposta, composta por Ordem de Serviço + Atributo (ou chave própria para atributos customizados como o COMLURB). Usada para upsert sem duplicar linhas."
        data_type: string
      - name: order
        description: "Ordem de exibição do atributo no formulário no momento da resposta. Permite reconstruir a sequência original das perguntas."
        data_type: numeric
      - name: section
        description: "Seção do formulário dinâmico à qual o atributo pertencia (abertura ou atualização da OS). Usada para separar as respostas visíveis ao cidadão das internas."
        data_type: string
      - name: service_attribute_library
        description: "Atributo do formulário dinâmico respondido nesta linha. Chave usada pelo roteamento condicional e pelo SLA para localizar o valor da resposta."
        data_type: string
      - name: service_form_config
        description: "Configuração do formulário (serviço + atributo) vigente no momento da resposta: guarda ordem, obrigatoriedade, seção e dependência condicional. Lookup (não Mestre-Detalhe) para preservar o histórico mesmo que o campo saia do formulário."
        data_type: string
      - name: value_boolean
        description: "Valor da resposta para atributos do tipo Checkbox (pergunta lógica Sim/Não)."
        data_type: boolean
      - name: value_date_time
        description: "Valor da resposta para atributos do tipo DateTime."
        data_type: timestamp
      - name: value_date
        description: "Valor da resposta para atributos do tipo Date."
        data_type: date
      - name: value_display
        description: "Versão legível (denormalizada) da resposta, preenchida para TODOS os tipos. Permite exibir e reportar o valor sem parse (ex.: JSON do COMLURB vira lista de itens; Date vira dd/MM/yyyy)."
        data_type: string
      - name: value_json
        description: "Valor da resposta para atributos compostos (ex.: Customizado/materiais COMLURB). Guardado como JSON estruturado. Para exibicao use Value_Display__c."
        data_type: string
      - name: value_long_text
        description: "Valor da resposta para atributos do tipo TextArea (texto longo)."
        data_type: string
      - name: value_multipicklist
        description: "Valor da resposta para atributos do tipo Multipicklist (selecao multipla). Armazena os valores separados por ponto e virgula."
        data_type: string
      - name: value_number
        description: "Valor da resposta para atributos do tipo Number. Tipado para permitir somas e agregações em relatórios e no Data 360."
        data_type: numeric
      - name: value_text
        description: "Valor da resposta para atributos dos tipos Text, Phone, Email e Picklist."
        data_type: string
      - name: is_internal
        description: "Verdadeiro quando a resposta pertence à seção interna (Atualização da OS), preenchida pelo despachador e não visível ao cidadão."
        data_type: boolean
      - name: _airbyte_extracted_at
        description: "Data/hora da extração no Airbyte (controle de carga)."
        data_type: datetime
        data_tests:
          - no_missing_dates

  - name: raw_czrm_staging__work_order_relationship
