        description: "Origem da conta"
        data_type: string
      - name: sic_desc
        description: "Descrição SIC"
        data_type: string
      - name: has_privacy_hold
        description: "Retenção de privacidade"
        data_type: boolean
      - name: cpf
        description: "Campo de identificação única (CPF) do cidadão. Configurado como ID Externo para integração com sistemas externos.=. Possui Regra de Validação para garantir exatamente 11 dígitos numéricos."
        data_type: string
      - name: nome_completo
        description: "Campo fórmula para exibir o nome completo sem exibir o campo de tratamento."
        data_type: string
      - name: ignore_validation_rule
        description: "Campo técnico que realiza bypass das regras de validação"
        data_type: boolean
      - name: is_tourist
        description: "Indica se o cidadao e um turista estrangeiro. Quando marcado, o campo de CPF e substituido pelo campo de Passaporte."
        data_type: boolean
      - name: last_access_servant_portal
        description: "Armazena a data e hora do último acesso do servidor ao portal de andamentos externos. Utilizado para calcular inatividade de 12 meses."
        data_type: timestamp
      - name: passport_number
        description: "Numero do passaporte do cidadao estrangeiro. Obrigatorio quando IsTourist__c = true. Formato: 5 a 20 caracteres alfanumericos."
        data_type: string
      - name: phone_1
        description: "Telefone principal do cidadao. Substitui o campo PersonMobilePhone. Formato hibrido: celular (55 + DDD + 9 + 8 digitos = 13) ou fixo (55 + DDD + 8 digitos = 12). Utilizado como primeiro canal de contato e para higienizacao de cadastro."
        data_type: string
      - name: phone_2
        description: "Telefone secundario do cidadao. Formato hibrido: celular (55+DDD+9+8 digitos) ou fixo (55+DDD+8 digitos). Utilizado no processo de higienizacao: se Phone_1__c falhar, Phone_2__c e promovido para Phone_1__c."
        data_type: string
      - name: phone_3
        description: "Telefone terciario do cidadao. Formato hibrido: celular (55+DDD+9+8 digitos) ou fixo (55+DDD+8 digitos). Utilizado no processo de higienizacao como terceira opcao apos Phone_1__c e Phone_2__c."
        data_type: string
      - name: social_name
        description: "Nome social do cidadao, quando informado. Exibido quando o checkbox Possui nome social estiver marcado no formulario de atendimento."
        data_type: string
      - name: address_complement
        description: "Complemento do endereco do cidadao (apto, bloco, sala, etc.). Armazenado separadamente do campo de endereco padrao do Salesforce."
        data_type: string
      - name: disability_type
        description: "Indica se o cidadão possui alguma deficiência e, em caso positivo, qual o tipo."
        data_type: string
      - name: display_name
        description: "Nome de exibição (apelido/nickname) autodeclarado pelo cidadão no portal. Difere do nome social (identidade de gênero)."
        data_type: string
      - name: education_level
        description: "Nível de escolaridade do cidadão."
        data_type: string
      - name: family_income
        description: "Faixa de renda familiar mensal do cidadão, expressa em salários mínimos."
        data_type: string
      - name: public_servant_status
        description: "Indica o status de acesso do servidor ao portal de andamentos externos. Controlado automaticamente por login e scheduled job de inatividade."
        data_type: string
      - name: nationality
        description: "Nacionalidade do cidadão."
        data_type: string
      - name: phone_1_type
        description: "Identifica automaticamente o tipo do Telefone principal com base no numero de digitos: 13 digitos = Celular (55+DDD+9+8), 12 digitos = Fixo (55+DDD+8)."
        data_type: string
      - name: phone_2_type
        description: "Identifica automaticamente o tipo do Telefone secundario com base no numero de digitos: 13 digitos = Celular (55+DDD+9+8), 12 digitos = Fixo (55+DDD+8)."
        data_type: string
      - name: phone_3_type
        description: "Identifica automaticamente o tipo do Telefone terciario com base no numero de digitos: 13 digitos = Celular (55+DDD+9+8), 12 digitos = Fixo (55+DDD+8)."
        data_type: string
      - name: phone_international
        description: "Telefone internacional do cidadao, destinado principalmente a turistas. Aceita qualquer formato de numero internacional sem validacao de DDI especifico."
        data_type: string
      - name: race_color
        description: "Cor ou raça autodeclarada pelo cidadão, conforme categorias do IBGE."
        data_type: string
      - name: is_public_servant
        description: "Indica se a Person Account presta serviço público (servidor/terceirizado/consultor). Utilizado para controlar acesso ao portal /servidor-pcrj."
        data_type: boolean
      - name: speaking_language
        description: "Idioma preferencial do cidadao para comunicacao. Campo opcional de perfil."
        data_type: string
      - name: last_update_channel
        description: "Canal da última atualização"
        data_type: string
      - name: email_corporativo
        description: "Email corporativo do servidor (obtido do User.Email interno). Usado para auditoria de quem presta serviço público e seu email funcional."
        data_type: string
      - name: user_internal
        description: "Usuário interno (licenca Standard) vinculado a esta Person Account. Amarra o User interno a conta do servidor."
        data_type: string
      - name: main_organizational_unit
        description: "Órgão central do servidor (sincronizado do User.main_organizational_unit__c). Picklist governada pelo GVS main_organizational_unit."
        data_type: string
      - name: user_external
        description: "Usuário externo (portal/cidadão) vinculado a esta Person Account. Espelha o Usuário Interno para dar visibilidade de qual User de comunidade representa o cadastro. Preenchido automaticamente pelo UserSyncHandler."
        data_type: string
      - name: receber_email_notificacao
        description: "Indica se o prestador deve receber e-mail de notificação ao ser acionado em um andamento externo. Desmarcado, o prestador continua vendo e respondendo o andamento no portal, mas não recebe o e-mail. Default true."
        data_type: boolean
      - name: et4ae5_has_opted_out_of_mobile_pc
        description: "Cancelar recebimento mobile"
        data_type: boolean
      - name: et4ae5_mobile_country_code_pc
        description: "Código de país do celular"
        data_type: string
      - name: _airbyte_extracted_at
        description: "Data/hora da extração no Airbyte (controle de carga)."
        data_type: datetime
        data_tests:
          - no_missing_dates

