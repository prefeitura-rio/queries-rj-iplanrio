        description: "Sinaliza que este serviço faz parte do fluxo de Acesso à Informação (LAI). Usado pela API de consulta de chamados para classificar a ordem de serviço como \"Acesso à Informação\" na UI do Portal, sem alterar a categoria interna do serviço."
        data_type: boolean
