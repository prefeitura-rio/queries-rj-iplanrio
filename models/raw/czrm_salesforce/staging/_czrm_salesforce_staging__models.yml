  - name: raw_czrm_staging__work_order_update
    description: "Tabela raw do objeto Salesforce correspondente a work_order_update (staging)."
    columns:
      - name: id
        description: "ID do registro"
        data_type: string
        data_tests:
          - unique:
              name: raw_czrm_staging__work_order_update__id__unique
              config:
                severity: error
          - not_null:
              name: raw_czrm_staging__work_order_update__id__not_null
              config:
                severity: error
      - name: is_deleted
        description: "Excluído"
        data_type: boolean
      - name: name
        description: "Cód. Andamento da OS"
        data_type: string
      - name: created_date
        description: "Campo formula que indica a data e hora de criação da OS (campo original não aparece na flexipage)"
        data_type: timestamp
      - name: created_by_id
        description: "ID do criador"
        data_type: string
      - name: last_modified_date
        description: "Data da última modificação"
        data_type: timestamp
      - name: last_modified_by_id
        description: "ID do último modificador"
        data_type: string
      - name: system_modstamp
        description: "Carimbo de modificação do sistema"
        data_type: timestamp
      - name: last_viewed_date
        description: "Data da última visualização"
        data_type: timestamp
      - name: last_referenced_date
        description: "Data da última referência"
        data_type: timestamp
      - name: work_order
        description: "Relacionamento que vincula o presente andamento ao registro mestre da Ordem de Serviço (WorkOrder)."
        data_type: string
      - name: event_type
        description: "Classifica o tipo do evento de andamento a partir de valores prédefinidos no Global Value Set = WorkOrderUpdate_Event_Type."
        data_type: string
      - name: response_deadline
        description: "Armazena a data e hora limite calculada para resposta do cidadão. Campo só é aplicável quanto o tipo de andamento é \"Pedido de informação\". Caso não haja resposta dentro desse prazo, a ordem de serviço é cancelada automaticamente."
        data_type: timestamp
      - name: response_time_days
        description: "Quantidade de dias corridos definidos como prazo para aguardar a resposta do cidadão. A OS será encerrada automaticamente caso o cidadão não responda dentro do prazo. Campo só é aplicável quanto o tipo de andamento é \"Pedido de informação\"."
        data_type: numeric
      - name: event_comments
        description: "Campo de texto longo que permite o registro do relato associado ao andamento. Acomoda pareceres descritivos e também interações via portal do cidadão."
        data_type: string
      - name: status
        description: "Indica o status do registro de andamento. Registros só são considerados oficiais quando o status for \"Publicado\" A visibilidade do andamento pelo cidadão depende do status ser \"Publicado\" e da configuração do evento permitir compartilhar essa informação."
        data_type: string
      - name: allow_citizen_visibility
        description: "Campo flag preenchido via flow no momento da criação do registro de andamento da OS e que replica a configuração de visibilidade definida no objeto."
        data_type: boolean
      - name: is_visible_to_citizen
        description: "Campo fórmula que verifica se a configuração do evento permite visibilidade para o cidadão e se o evento de andamento já encontra-se publicado."
        data_type: boolean
      - name: approver
        description: "Caso o evento tenha passado por um processo de aprovação é armazenado neste campo o usuário que aprovou ou rejeitou o registro de andamento."
        data_type: string
      - name: rejection_reason
        description: "Campo destinado a armazenar a justificativa técnica ou administrativa fornecida pelo Despachador Central ao recusar a publicação ou validade deste andamento. Preenchido ativamente durante o fluxo de aprovação. Exibe valores do campo GVS = WorkOrderUpdate_Rejection_Reason"
        data_type: string
      - name: email_servidor_sent
        description: "Indica se a notificação por e-mail aos destinatários (servidores) já foi processada para este andamento, evitando reenvios em caso de atualizações subsequentes do registro."
        data_type: boolean
      - name: transaction_id
        description: "Campo exclusivo para registrar a transação recebida de sistemas externos dos órgãos através de integração com Mulesoft"
        data_type: string
      - name: approval_process_start
        description: "Campo preenchido via flow sempre que é iniciado um processo de aprovação para o registro de andamento."
        data_type: timestamp
      - name: approve_decision_datetime
        description: "Campo preenchido via flow sempre que é finalizado um processo de aprovação para o registro de andamento"
        data_type: timestamp
      - name: has_approval_process
        description: "Campo fórmula que indica se houve um processo de aprovação para o registgro de andamento."
        data_type: boolean
      - name: justification
        description: "Justificativa selecionada para o andamento. Vinculada ao catálogo global de justificativas. Preenchida quando o evento configurado possui justificativas associadas via Event_Config_Justification__c."
        data_type: string
      - name: approval_outcome
        description: "Registra o resultado do processo de aprovação do andamento. Preenchido pelo screen flow de aprovação. Usado em métricas de intervenção do Despachador Central."
        data_type: string
      - name: modification_reason
        description: "Justificativa fornecida pelo Despachador Central quando o andamento foi aprovado com modificações no relato original. Preenchido pelo screen flow de aprovação."
        data_type: string
      - name: response_to
        description: "Andamento de origem (pedido de informação ao servidor) que esta resposta atende. Vínculo explícito resposta→pedido, permitindo rastrear qual pedido foi respondido e rejeitar duplicatas por pedido."
        data_type: string
      - name: cancellation_datetime
        description: "Data e hora em que o andamento foi cancelado. Preenchido automaticamente quando o status passa para Cancelado."
        data_type: timestamp
      - name: transfer_target
        description: "Armazena o ID do serviço destino e da categoria config para transferência de OS. Formato: {serviceId},{categoryConfigId}."
        data_type: string
      - name: modified_comments
        description: "Relato atual do andamento. Preenchido automaticamente na criação com o relato original e atualizado quando o Despachador Central aprova com modificação."
        data_type: string
      - name: is_replicated
        description: "Indica que este WOU foi criado por replicacao de equivalencia. Usado como guard de recursao no WorkOrderUpdateTrigger."
        data_type: boolean
      - name: email_notification_sent
        description: "Indica se o fluxo de notificação por e-mail ao cidadão já foi processado para este andamento, evitando reenvios em caso de atualizações subsequentes do registro."
        data_type: boolean
      - name: share_citizen_data
        description: "Indica se os dados do cidadão (nome, endereço) devem ser exibidos ao servidor no portal de andamentos externos. Marcado pelo despachador no momento do envio do andamento."
        data_type: boolean
      - name: target_account
        description: "Servidor destinatário individual de um andamento externo (\"Pedido de informação ao servidor\"). Mutuamente exclusivo com Target_Group__c."
        data_type: string
      - name: target_group
        description: "Grupo de acionamento destino de um andamento externo (\"Pedido de informação ao servidor\"). Mutuamente exclusivo com Target_Account__c."
        data_type: string
      - name: dynamic_fields_json
        description: "Guarda o JSON dos campos dinamicos da secao \"Atualizacao da OS\" ate a aprovacao da WOU. Apos aprovar, os valores sao aplicados na WorkOrder."
        data_type: string
      - name: target_uo_id
        description: "Destino da mudança de fila/troca de UO (Change_Queue_UO). Aplicado na WorkOrder somente após a aprovação."
        data_type: string
      - name: cancellation_reason
        description: "Motivo do cancelamento do andamento. Preenchido automaticamente pelo cancelamento automático (fechamento/cancelamento da OS) ou pelo cancelamento manual do andamento. Exibe valores do GVS = WorkOrderUpdate_Cancellation_Reason"
        data_type: string
      - name: publication_datetime
        description: "Data e hora em que o andamento foi publicado. Preenchido via flow quando o status passa para Publicado, com ou sem aprovação. Campo único de publicação (CZRM-2306)."
        data_type: timestamp
      - name: origin_service
        description: "Serviço de origem de uma transferência de OS (Event_Type__c = Transfer_WO). Gravado no registro do andamento com o WorkOrder.Service__c vigente no momento da solicitação, porque a aprovação da transferência sobrescreve o serviço da OS com o destino e a origem deixaria de ser recuperável. Permite exibir \"Transferida de [origem] para [destino]\" na linha do tempo."
        data_type: string
      - name: data_criacao
        description: "Data/hora de criação informada pelo órgão (campo `Created_date__c`). Diferente de `created_date`, que é a criação do registro."
        data_type: timestamp
      - name: notificacao_proprietario_sent
        description: "Indica se a notificação ao proprietário da OS sobre a resposta a um andamento externo já foi processada, evitando reenvios em retriggers do registro."
        data_type: boolean
      - name: whats_app_notification_sent
        description: "Indica se o fluxo de notificacao por WhatsApp ao cidadao ja foi processado para este andamento, evitando reenvios em caso de atualizacoes subsequentes do registro. Independente do Email_Notification_Sent__c."
        data_type: boolean
      - name: data_hora_andamento
        description: "Referência de negócio do andamento (dataHora do órgão), com checagem de sanidade. Não usar Publication_Datetime__c."
        data_type: timestamp
      - name: integration_event
        description: "Evento de integração que originou este andamento. Discriminador do resolvedor de status (integração ⇒ CMT2) e rastro/idempotência."
        data_type: string
      - name: status_especifico_orgao
        description: "statusEspecifico cru informado pelo órgão (contrato da VOLTA — não perder). Base do de-para CMT1."
        data_type: string
      - name: status_normalizado
        description: "Status do órgão já normalizado (de-para 1 / CMT1). Distingue casos que reusam o mesmo evento (ex.: 21 x 16)."
        data_type: string
      - name: uo_informada_orgao
        description: "Unidade organizacional informada pelo órgão no andamento (siglaUnidadeOrganizacional). Texto, sem match com a base do Salesforce."
        data_type: string
      - name: related_work_order
        description: "OS citada por este andamento quando ele é registrado em outra OS (ex.: aviso de equivalência gravado na agrupadora, apontando a OS agrupada). Alimenta o atalho da linha do tempo."
        data_type: string
      - name: form_answers_json
        description: "Guarda o JSON das respostas do formulario do servico de destino preenchidas na transferencia, ate a aprovacao da WOU. Ao aprovar, as respostas sao gravadas em WorkOrder_Attribute_Answer__c antes de montar o payload do orgao."
        data_type: string
      - name: _airbyte_extracted_at
        description: "Data/hora da extração no Airbyte (controle de carga)."
        data_type: datetime
        data_tests:
          - no_missing_dates
