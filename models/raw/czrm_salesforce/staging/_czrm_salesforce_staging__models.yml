        description: "Chave composta gerada automaticamente (Record Type + ID do Tema + ID do Subtema + Nome do Serviço) que garante a unicidade da combinação. Impede a criação de registros duplicados para o mesmo serviço dentro da mesma hierarquia. Preenchida por Flow Before Save — não editar manualmente."
