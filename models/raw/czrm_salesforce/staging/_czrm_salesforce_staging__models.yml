                severity: error
          - not_null:
              name: raw_czrm_staging__work_order_relationship__id__not_null
              config:
                severity: error
      - name: owner_id
        description: "ID do proprietário"
        data_type: string
      - name: is_deleted
        description: "Excluído"
        data_type: boolean
      - name: name
        description: "Nº Relação"
        data_type: string
      - name: created_date
        description: "Data de criação"
        data_type: timestamp
      - name: created_by_id
        description: "ID do criador"
        data_type: string
      - name: last_modified_date
        description: "Data da última modificação"
        data_type: timestamp
      - name: last_modified_by_id
        description: "ID do último modificador"
        data_type: string
      - name: system_modstamp
        description: "Carimbo de modificação do sistema"
        data_type: timestamp
      - name: case
        description: "Caso (protocolo) associado ao vínculo entre as ordens de serviço."
        data_type: string
      - name: tipo
        description: "Indica a natureza do vínculo entre as ordens de serviço."
        data_type: string
      - name: wo_origem
        description: "Ordem de serviço de origem do vínculo."
