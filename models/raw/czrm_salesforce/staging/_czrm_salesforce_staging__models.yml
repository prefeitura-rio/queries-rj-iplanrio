        data_type: string
      - name: theme_formula
        description: "Campo fórmula que permite exibição do tema sem formato lookup."
        data_type: string
      - name: subtheme_formula
        description: "Campo fórmula que permite exibição do subtema sem formato lookup."
        data_type: string
      - name: service_name
        description: "Campo preenchido via flow com intuito de permitr gravar o nome do serviço com mais de 80 caracteres. Terceiro nível de classificação (N3), identificando especificamente o serviço que está sendo solicitado."
        data_type: string
