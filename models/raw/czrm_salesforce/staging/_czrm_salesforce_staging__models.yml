        description: "Campo fórmula que permite exibição de hyperlink para o registro a partir de listviews."
        data_type: string
      - name: responsible_org_unit
        description: "Órgão municipal (Nível 1) que detém a responsabilidade administrativa sobre a execução do serviço."
        data_type: string
      - name: record_type_developer_name
        description: "Indica o nome API do tipo de registro de Unidade Organizacional."
        data_type: string
      - name: _airbyte_extracted_at
        description: "Data/hora da extração no Airbyte (controle de carga)."
        data_type: datetime
        data_tests:
          - no_missing_dates

