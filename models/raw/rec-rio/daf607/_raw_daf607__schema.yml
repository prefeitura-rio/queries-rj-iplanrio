    columns:
      - name: codigo_registro
        description: Código do registro, constante = 1 (posição 1)
      - name: sequencial
        description: Sequencial do registro, constante = 00000001 (posições 2-9)
      - name: codigo_convenio
        description: Código do convênio, constante = DAF607 SIMPLESNACION (posições 10-29)
      - name: data_geracao
        description: Data da geração do arquivo no formato AAAAMMDD (posições 30-37)
      - name: numero_remessa
        description: Número da remessa do SERPRO (posições 38-43)
