        description: Código do banco arrecadador do documento (posições 76-78)
      - name: data_credito
        description: Data de crédito no Banco/SERPRO no formato AAAAMMDD (posições 68-75)
      - name: ano_particao
        description: Ano de partição dos dados
      - name: mes_particao
        description: Mês de partição dos dados
      - name: data_particao
        description: Data de partição dos dados
      - name: arquivo_origem
        description: Nome do arquivo de origem dos dados
      - name: loaded_at
        description: Data e hora de carregamento do registro

