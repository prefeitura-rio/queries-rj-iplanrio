version: 2

models:
  - name: raw_recursos_humanos_ergon__folhas_emp
    description: "**Descrição**: Folhas de pagamento por empresa.\n**Frequência de atualização**: Diária\n**Cobertura temporal**: Data do menor registro\n**Órgão gestor dos dados**: SMA\n"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: raw_recursos_humanos_ergon__folhas_emp__unique_combination_of_columns
          combination_of_columns:
            - mes_ano_folha
            - numero_folha
            - id_empresa
          config:
            severity: warn
    columns:
      - name: mes_ano_folha
        description: Mês e ano de referência da folha.
        data_type: date
        data_tests:
          - not_null:
              name: raw_recursos_humanos_ergon__folhas_emp__mes_ano_folha__not_null
              config:
                severity: warn
      - name: numero_folha
        description: Número da folha.
        data_type: string
        quote: true
        data_tests:
          - not_null:
              name: raw_recursos_humanos_ergon__folhas_emp__numero_folha__not_null
              config:
                severity: warn
      - name: id_empresa
        description: Código da empresa.
        data_type: string
        quote: true
        data_tests:
          - not_null:
              name: raw_recursos_humanos_ergon__folhas_emp__id_empresa__not_null
              config:
                severity: warn
      - name: tipo_folha
        description: Tipo da folha de pagamento.
        data_type: string
        quote: true
      - name: nome
        description: Nome da folha.
        data_type: string
        quote: true
      - name: data_abertura
        description: Data de abertura da folha.
