name: Auto approve PRs for core maintainers

on: pull_request_target

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.actor == 'tricktx' || github.actor == 'd116626' || github.actor == 'gabriel-milan'
    steps:
      - uses: hmarr/auto-approve-action@v3